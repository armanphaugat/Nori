version: "3.9"

# Nori — backend-only stack (Podman on VPS)
#
# Services:
#   backend  → FastAPI + Discord bot on port 12000
#   bullmq   → rotates Groq/Tavily/Exa keys every 5 min
#
# Redis runs on the HOST — start it before bringing this stack up:
#   podman run -d --name redis -p 6379:6379 redis redis-server --requirepass noripassword

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nori-backend
    ports:
      - "12000:12000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=noripassword
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - nori-net

  bullmq:
    build:
      context: .
      dockerfile: Dockerfile.bullmq
    container_name: nori-bullmq
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=noripassword
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - nori-net

networks:
  nori-net:
    driver: bridge