version: "3.9"

# Nori — production stack (Oracle Cloud / any Docker host)
#
# Services:
#   redis    → API key rotation + BullMQ
#   backend  → FastAPI + Discord bot (shared process container)
#   bullmq   → rotates Groq/Tavily/Exa keys every 5 min
#   frontend → React dashboard behind nginx (/api → backend)

services:

  bullmq:
    build:
      context: .
      dockerfile: Dockerfile.bullmq
    container_name: nexus-bullmq
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_USER=vaultbot
      - REDIS_PASSWORD=noripassword
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - nexus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    container_name: nexus-frontend
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge
