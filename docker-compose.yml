version: "3.9"

# Q-ARAG — production stack (Oracle Cloud / any Docker host)
#
# Services:
#   redis    → API key rotation + BullMQ
#   backend  → FastAPI + Discord bot (shared process container)
#   bullmq   → rotates Groq/Tavily/Exa keys every 5 min
#   frontend → React dashboard behind nginx (/api → backend)

services:

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nexus-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UVICORN_WORKERS=1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bullmq:
    build:
      context: .
      dockerfile: Dockerfile.bullmq
    container_name: nexus-bullmq
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    container_name: nexus-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexus-net

volumes:
  redis_data:
    driver: local

networks:
  nexus-net:
    driver: bridge
