server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # SPA fallback — react-router-dom handles all routes client-side.
    # Without this, a hard refresh on /dashboard returns 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend so the frontend never needs CORS headers
    # in production (requests stay same-origin from the browser's perspective)
    location /api/ {
        proxy_pass         http://host.docker.internal:12000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # uploads + LLM calls can be slow
        proxy_send_timeout 120s;
    }

    # Cache built JS/CSS chunks aggressively — Vite hashes them on every build
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}